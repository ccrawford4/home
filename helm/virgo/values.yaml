application-template:
  name: virgo
  namespace: virgo
  serviceAccount:
    create: true
    name: virgo
  securityContext:
    privileged: true # Allow container to write to the node directly (workaround since k3s doesnt support Block storage by default)
  deployments:
    - name: virgo
      replicaCount: 1
      image:
        repository: us-central1-docker.pkg.dev/home-473419/internal/virgo
        pullPolicy: IfNotPresent
        tag: "v2.8.0"
        port: 8000
      service:
        enabled: true
        port: 8000
      container:
        volumeMounts:
          - name: gcp-sa-token
            mountPath: /var/run/secrets/workload-identity-federation
          - name: hailo-ollama
            mountPath: /usr/share/hailo-ollama/models/blob
          - name: hailo-vdevice
            mountPath: /dev/hailo1
        command: ["/bin/sh", "-c", "hailo-ollama"]
      nodeSelector:
        kubernetes.io/hostname: virgo
      volumes:
        - name: gcp-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "//iam.googleapis.com/projects/631401797177/locations/global/workloadIdentityPools/home-cluster-pool/providers/home-cluster-oidc-provider"
                  expirationSeconds: 3600
                  path: token
        - name: hailo-ollama
          persistentVolumeClaim:
            claimName: hailo-ollama-pvc
        - name: hailo-vdevice
          hostPath:
            path: /dev/hailo0 # Path to NPU device on Rasberry Pi AHT 2+ (the node itself)
    - name: virgo-gui
      replicaCount: 1
      image:
        repository: ghcr.io/open-webui/open-webui
        pullPolicy: IfNotPresent
        tag: "main"
        port: 8080
      service:
        enabled: true
        port: 8080
      container:
        env:
          - name: WEBUI_ADMIN_EMAIL
            value: calumcrawford9@gmail.com
          - name: WEBUI_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: virgo-secrets
                key: webui-admin-password
          # Pin the backend so it survives pod restarts (the DB is ephemeral).
          - name: OLLAMA_BASE_URL
            value: http://virgo.virgo.svc.cluster.local:8000
          - name: ENABLE_OPENAI_API
            value: "False"
          # hailo-ollama models have a ~2k token context and serve one request at a time.
          # Builtin tools inject ~6k tokens of tool schemas into every UI request, which
          # makes the NPU return garbage or a 500, so turn them off for all models.
          - name: DEFAULT_MODEL_METADATA
            value: '{"capabilities":{"builtin_tools":false}}'
          # Cap output so a runaway generation can't hold the NPU for minutes.
          - name: DEFAULT_MODEL_PARAMS
            value: '{"num_predict":512}'
          # Background tasks queue ahead of the reply on the single-request NPU
          # (title generation delayed replies by ~2 minutes).
          - name: ENABLE_TITLE_GENERATION
            value: "False"
          - name: ENABLE_TAGS_GENERATION
            value: "False"
          - name: ENABLE_FOLLOW_UP_GENERATION
            value: "False"
          - name: ENABLE_AUTOCOMPLETE_GENERATION
            value: "False"
        volumeMounts:
          - name: gcp-sa-token
            mountPath: /var/run/secrets/workload-identity-federation
      nodeSelector:
        kubernetes.io/hostname: virgo
      volumes:
        - name: gcp-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "//iam.googleapis.com/projects/631401797177/locations/global/workloadIdentityPools/home-cluster-pool/providers/home-cluster-oidc-provider"
                  expirationSeconds: 3600
                  path: token
  persistentVolumeClaims:
    - name: hailo-ollama
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
  # TODO: bring back the PVC by using a library like OpenEBS to support PVCs. K3s does NOT support block storage by default
  # - name: hailo-vdevice
  #   accessModes: ["ReadWriteOnce"]
  #   volumeMode: Block
  #   storageClass: local-path
  #   resources:
  #     requests:
  #       storage: 20Gi

  secrets:
    - name: virgo-secrets
      data:
        - secretKey: webui-admin-password
          remoteRefKey: virgo-webui-admin-password
