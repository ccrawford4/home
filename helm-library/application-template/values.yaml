serviceAccount: {}

# Store referenced by every ExternalSecret in `secrets`.
secretStoreRef:
  name: gcp-secret-manager
  kind: SecretStore

# Per-namespace SecretStore backed by Google Secret Manager. External Secrets
# Operator authenticates as `serviceAccount` (default: serviceAccount.name)
# through Workload Identity Federation, so it can only read secrets granted to
# this namespace in terraform/workloads.tf.
secretStore:
  create: true
  serviceAccount: ""
  projectID: home-473419
  audience: //iam.googleapis.com/projects/631401797177/locations/global/workloadIdentityPools/home-cluster-pool/providers/home-cluster-oidc-provider
